name: 야쿱 뉴스 크롤러

on:
  schedule:
    - cron: '0 0 * * *'
  
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4
    
    - name: Python 3.11 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 크롤러 실행
      run: python scraper.py
    
    - name: 변경사항 커밋 및 푸시
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git diff --cached --exit-code || (git commit -m "🤖 자동 업데이트: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" && git push)
