<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국유나이티드제약 뉴스 - 야쿱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .sort-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .sort-container label {
            font-weight: 600;
            color: #333;
        }

        .sort-container select {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            background: white;
        }

        .sort-container select:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-size: 0.95em;
            color: #555;
        }

        .stats strong {
            color: #667eea;
            font-size: 1.2em;
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .article-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .article-header {
            padding: 20px;
            border-bottom: 3px solid #667eea;
            flex-grow: 1;
        }

        .article-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
            color: #999;
            margin-bottom: 10px;
        }

        .article-date {
            background: #f0f0f0;
            padding: 3px 8px;
            border-radius: 3px;
        }

        .article-keywords {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .keyword-tag {
            display: inline-block;
            background: #e8eaf6;
            color: #667eea;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .article-footer {
            padding: 15px 20px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
        }

        .article-link {
            display: inline-block;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        .article-link:hover {
            opacity: 0.9;
        }

        .no-articles {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: #999;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .no-articles p {
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .refresh-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #667eea;
            color: white;
        }

        .loading {
            text-align: center;
            color: white;
            padding: 40px;
            font-size: 1.2em;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 0.9em;
            margin-top: 40px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .sort-container {
                width: 100%;
                justify-content: space-between;
            }

            .articles-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📰 한국유나이티드제약 뉴스</h1>
            <p>야쿱(yakup.com)에서 자동으로 수집한 최신 기사</p>
        </header>

        <div class="controls">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="기사 제목으로 검색..."
                    autocomplete="off"
                >
            </div>
            <div class="sort-container">
                <label for="sortSelect">정렬:</label>
                <select id="sortSelect">
                    <option value="date-desc">최신순</option>
                    <option value="date-asc">오래된순</option>
                    <option value="title-asc">제목(A-Z)</option>
                </select>
            </div>
            <button class="refresh-btn" id="refreshBtn">새로고침</button>
        </div>

        <div class="stats" id="stats">로딩 중...</div>

        <div id="articlesContainer" class="loading">
            <div class="spinner"></div>
            <p>기사를 불러오는 중입니다...</p>
        </div>
    </div>

    <footer>
        <p>🤖 자동 업데이트: 매일 자정(UTC) | 데이터 출처: <a href="https://www.yakup.com/" style="color: white; text-decoration: underline;">yakup.com</a></p>
    </footer>

    <script>
        let allArticles = [];

        // GitHub Raw URL에서 데이터 로드
        const DATA_URL = 'https://raw.githubusercontent.com/hey933/yakup-korean-united-pharma-news/main/data/articles.json';

        async function loadArticles() {
            try {
                const response = await fetch(DATA_URL);
                if (!response.ok) throw new Error('데이터 로드 실패');
                
                const data = await response.json();
                allArticles = data.articles || [];
                
                updateStats();
                renderArticles(allArticles);
            } catch (error) {
                console.error('오류:', error);
                showError('기사를 불러올 수 없습니다. 잠시 후 다시 시도해주세요.');
            }
        }

        function updateStats() {
            const statsDiv = document.getElementById('stats');
            const lastUpdated = allArticles.length > 0 
                ? new Date(allArticles[0].date).toLocaleDateString('ko-KR')
                : '정보 없음';
            
            statsDiv.innerHTML = `
                총 <strong>${allArticles.length}</strong>개의 기사 | 
                마지막 업데이트: <strong>${lastUpdated}</strong>
            `;
        }

        function renderArticles(articles) {
            const container = document.getElementById('articlesContainer');
            
            if (articles.length === 0) {
                container.innerHTML = `
                    <div class="no-articles">
                        <p>검색 결과가 없습니다.</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">다른 검색어를 시도해보세요.</p>
                    </div>
                `;
                return;
            }

            const articlesHTML = articles.map(article => `
                <div class="article-card">
                    <div class="article-header">
                        <div class="article-title">${escapeHtml(article.title)}</div>
                        <div class="article-meta">
                            <span class="article-date">${formatDate(article.date)}</span>
                            <span>${article.source}</span>
                        </div>
                        ${article.keywords && article.keywords.length > 0 ? `
                            <div class="article-keywords">
                                ${article.keywords.map(kw => `<span class="keyword-tag">${escapeHtml(kw)}</span>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                    <div class="article-footer">
                        <a href="${article.url}" target="_blank" rel="noopener noreferrer" class="article-link">기사 보기 →</a>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `<div class="articles-grid">${articlesHTML}</div>`;
        }

        function filterAndSort() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sortOption = document.getElementById('sortSelect').value;

            let filtered = allArticles.filter(article =>
                article.title.toLowerCase().includes(searchTerm)
            );

            // 정렬
            filtered.sort((a, b) => {
                switch(sortOption) {
                    case 'date-asc':
                        return new Date(a.date) - new Date(b.date);
                    case 'title-asc':
                        return a.title.localeCompare(b.title, 'ko');
                    case 'date-desc':
                    default:
                        return new Date(b.date) - new Date(a.date);
                }
            });

            renderArticles(filtered);
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const container = document.getElementById('articlesContainer');
            container.innerHTML = `
                <div class="no-articles">
                    <p>⚠️ ${message}</p>
                </div>
            `;
        }

        // 이벤트 리스너
        document.getElementById('searchInput').addEventListener('input', filterAndSort);
        document.getElementById('sortSelect').addEventListener('change', filterAndSort);
        document.getElementById('refreshBtn').addEventListener('click', () => {
            document.getElementById('articlesContainer').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>새로고침 중...</p>
                </div>
            `;
            loadArticles();
        });

        // 페이지 로드 시 기사 로드
        window.addEventListener('load', loadArticles);
    </script>
</body>
</html>
